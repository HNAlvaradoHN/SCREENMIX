name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject tracked private signing files
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|/)(local\.properties|keystore\.properties|signing\.properties|\.env|debug\.keystore|release\.keystore|[^/]+\.(jks|keystore|p12|pfx|pem|key))$'
          if git ls-files | grep -Eiq "$pattern"; then
            echo "Private signing/configuration files must not be tracked:"
            git ls-files | grep -Ei "$pattern"
            exit 1
          fi

      - name: Verify release tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}."
            exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify signing secrets
        shell: bash
        env:
          SCREENMIX_KEYSTORE_BASE64: ${{ secrets.SCREENMIX_KEYSTORE_BASE64 }}
          SCREENMIX_KEYSTORE_PASSWORD: ${{ secrets.SCREENMIX_KEYSTORE_PASSWORD }}
          SCREENMIX_KEY_ALIAS: ${{ secrets.SCREENMIX_KEY_ALIAS }}
          SCREENMIX_KEY_PASSWORD: ${{ secrets.SCREENMIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            "$SCREENMIX_KEYSTORE_BASE64" \
            "$SCREENMIX_KEYSTORE_PASSWORD" \
            "$SCREENMIX_KEY_ALIAS" \
            "$SCREENMIX_KEY_PASSWORD"
          do
            if [ -z "$value" ]; then
              echo "One or more required release signing secrets are missing."
              exit 1
            fi
          done

      - name: Prepare temporary signing key
        shell: bash
        env:
          SCREENMIX_KEYSTORE_BASE64: ${{ secrets.SCREENMIX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/screenmix-release.jks"
          umask 077
          printf '%s' "$SCREENMIX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SCREENMIX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          SCREENMIX_KEYSTORE_PASSWORD: ${{ secrets.SCREENMIX_KEYSTORE_PASSWORD }}
          SCREENMIX_KEY_ALIAS: ${{ secrets.SCREENMIX_KEY_ALIAS }}
          SCREENMIX_KEY_PASSWORD: ${{ secrets.SCREENMIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon verifyReleaseSigning assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/ScreenMix-${APP_VERSION}.apk"
          (
            cd release
            sha256sum "ScreenMix-${APP_VERSION}.apk" > "ScreenMix-${APP_VERSION}.apk.sha256"
          )

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMix-${{ env.APP_VERSION }}-release
          path: |
            release/ScreenMix-${{ env.APP_VERSION }}.apk
            release/ScreenMix-${{ env.APP_VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "release/ScreenMix-${APP_VERSION}.apk" \
            "release/ScreenMix-${APP_VERSION}.apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "ScreenMix ${APP_VERSION}"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/screenmix-release.jks"
